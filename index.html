<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KROCO AYAM - TOPUP APP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f5f5f5}
.topbar{background:#ee4d2d;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar b{font-size:18px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:12px}
.card{background:#fff;border-radius:20px;box-shadow:0 4px 14px #0001;overflow:hidden;text-align:center}
.card .img{height:160px;display:flex;align-items:center;justify-content:center;font-size:70px}
.card b{display:block;padding:12px;font-size:15px}
.pay{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -2px 10px #0002}
.pay button{background:#ee4d2d;color:#fff;border:0;padding:12px 22px;border-radius:12px;font-weight:800;font-size:16px}
</style>
</head>

<div class="topbar"><b>🔥 KROCO AYAM</b><span>🛒</span></div>

</div>

<div class="card" onclick="order('Free Fire')"><div class="img" style="background:linear-gradient(135deg,#ff9500,#ff2d00)">🔥</div><b>Free Fire</b></div>
<div class="card" onclick="order('Mobile Legends')"><div class="img" style="background:linear-gradient(135deg,#00c6ff,#0072ff)">⚔️</div><b>Mobile Legends</b></div>

<div class="pay"><div><small>Metode:</small><br><b>ShopeePay 🧡</b></div><button onclick="order('Topup')">Checkout</button></div>

function order(g){location.href='https://wa.me/6283872363213?text=Halo%20KROCO%20AYAM%2C%20mau%20topup%20'+g+'%20via%20ShopeePay'}

</html>
