<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLTOPUP - ShopeePay Games Clone</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif;background:#f8f9ff}.game-card{transition:.15s}.game-card:active{transform:scale(.96)}.hide-scrollbar::-webkit-scrollbar{display:none}</style>
</head>
<body>
<div class="sticky top-0 z-40 bg-white border-b">
<div class="flex items-center gap-3 px-4 py-3">
<button onclick="showHome()" class="text-xl">‹</button>
<div class="flex-1 flex items-center gap-2"><div class="w-6 h-6 rounded bg-gradient-to-r from-blue-500 to-cyan-400 flex items-center justify-center text-white text-xs font-bold">S</div><b class="text-sm">Games & Hiburan</b></div>
<div class="flex gap-3 text-gray-400"><span>🔍</span><span>☰</span></div>
</div>
<div class="flex gap-2 px-4 pb-3 overflow-auto">
<button id="tab-populer" onclick="setTab('populer')" class="bg-black text-white px-4 py-1.5 rounded-full text-[11px] font-bold">Game Populer</button>
<button id="tab-topup" onclick="setTab('topup')" class="bg-gray-100 px-4 py-1.5 rounded-full text-[11px] font-bold">Top Up Games</button>
<button id="tab-voucher" onclick="setTab('voucher')" class="bg-gray-100 px-4 py-1.5 rounded-full text-[11px] font-bold">Voucher</button>
<button id="tab-tagihan" onclick="setTab('tagihan')" class="bg-gray-100 px-4 py-1.5 rounded-full text-[11px] font-bold">Tagihan</button>
</div>
</div>
<main class="max-w-6xl mx-auto pb-24">
<div id="banner" class="mx-4 mt-4 bg-gradient-to-r from-red-500 to-orange-400 rounded-xl p-3 text-white flex justify-between items-center"><div><b class="text-xs">Promo Hemat! Diskon s.d 100RB</b><p class="text-[10px] opacity-90">Mabar Seru, Promo Hemat!</p></div><div class="bg-white text-red-500 text-[10px] font-black px-2 py-1 rounded">20% OFF</div></div>
<div id="section-games" class="px-4 mt-5">
<div class="flex justify-between items-center mb-3"><b class="text-sm">Game Populer</b><span class="text-[11px] text-blue-600">Lihat Semua ›</span></div>
<div id="gameGridPopuler" class="grid grid-cols-3 gap-3"></div>
<div class="flex justify-between items-center mt-6 mb-3"><b class="text-sm">Top Up Games</b><span class="text-[11px] text-blue-600">Lihat Semua ›</span></div>
<div id="gameGridTopup" class="grid grid-cols-3 gap-3"></div>
<div class="flex justify-between items-center mt-6 mb-3"><b class="text-sm">Voucher</b><span class="text-[11px] text-blue-600">Lihat Semua ›</span></div>
<div id="gameGridVoucher" class="grid grid-cols-3 gap-3"></div>
<div class="flex justify-between items-center mt-6 mb-3"><b class="text-sm">Tagihan & Isi Ulang</b><span class="text-[11px] text-blue-600">Lihat Semua ›</span></div>
<div id="gameGridTagihan" class="grid grid-cols-4 gap-3"></div>
</div>
<div id="section-products" class="hidden px-4 mt-4">
<button onclick="showHome()" class="mb-3 bg-white border px-4 py-2 rounded-full text-xs font-bold">‹ Kembali ke Daftar Game</button>
<div id="selectedGameHeader" class="bg-white rounded-2xl p-4 border flex items-center gap-3 mb-4"></div>
<div id="productList" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
</div>
</main>
<button onclick="openCart()" class="fixed bottom-5 right-5 bg-blue-600 text-white px-6 py-3 rounded-full font-bold shadow-lg z-50 flex items-center gap-2">🛒 <span id="cartCount">0</span> <span class="text-[11px]">| Checkout</span></button>
<div id="cartModal" class="fixed inset-0 z-[100] bg-black/60 hidden flex items-end md:items-center justify-center">
<div class="bg-white rounded-t-2xl md:rounded-2xl w-full max-w-md p-5 max-h-[85vh] overflow-auto">
<div class="flex justify-between mb-4"><b class="text-sm">Keranjang ala ShopeePay</b><button onclick="closeCart()" class="bg-gray-100 px-3 py-1 rounded-full text-xs">✕</button></div>
<div id="cartItems" class="space-y-2 mb-3"></div>
<div id="cartSummary" class="bg-blue-50 border rounded-xl p-3 text-[11px] mb-3 space-y-1"></div>
<input id="custId" placeholder="ID Game / No Meter PLN / No HP" class="w-full border rounded-xl p-3 text-sm mb-2">
<select id="payMethod" class="w-full border rounded-xl p-3 text-sm mb-3 bg-white"><option>OVO - 087775709964 a/n ACHMAD SUBARKAH</option><option>GoPay - 087775709964 a/n ACHMAD SUBARKAH</option><option>ShopeePay - 087775709964 a/n ACHMAD SUBARKAH</option><option>SeaBank - 901136981934 a/n ACHMAD SUBARKAH</option></select>
<button onclick="processOrder()" class="w-full bg-blue-600 text-white py-3 rounded-full font-bold text-sm">Bayar Sekarang ⚡</button>
</div>
</div>
<script>
const games=[
{id:'ff',name:'Free Fire',cat:'populer',icon:'🔥',color:'bg-orange-100'},
{id:'mlbb',name:'Mobile Legends',cat:'populer',icon:'🛡️',color:'bg-blue-100'},
{id:'magic',name:'Magic Chess Go Go',cat:'populer',icon:'♟️',color:'bg-purple-100'},
{id:'steam',name:'Steam',cat:'populer',icon:'🎮',color:'bg-gray-100'},
{id:'roblox',name:'Roblox',cat:'populer',icon:'⬜',color:'bg-red-100'},
{id:'valorant',name:'Valorant',cat:'populer',icon:'🔫',color:'bg-red-100'},
{id:'genshin',name:'Genshin Impact',cat:'topup',icon:'✨',color:'bg-cyan-100'},
{id:'monster',name:'Monster Hunter',cat:'topup',icon:'🐉',color:'bg-green-100'},
{id:'delta',name:'Delta Force',cat:'topup',icon:'⚔️',color:'bg-zinc-100'},
{id:'lords',name:'Lords Mobile',cat:'topup',icon:'🏰',color:'bg-yellow-100'},
{id:'pubg',name:'PUBG Mobile',cat:'topup',icon:'🎯',color:'bg-yellow-100'},
{id:'hok',name:'Honor of Kings',cat:'topup',icon:'👑',color:'bg-amber-100'},
{id:'pubgv',name:'PUBG Mobile Voucher',cat:'voucher',icon:'🎮',color:'bg-gray-100'},
{id:'megaxus',name:'Megaxus',cat:'voucher',icon:'💳',color:'bg-blue-100'},
{id:'pubgpc',name:'PUBG PC',cat:'voucher',icon:'💻',color:'bg-orange-100'},
{id:'gplay',name:'Google Play',cat:'voucher',icon:'▶️',color:'bg-green-100'},
{id:'efootball',name:'eFootball',cat:'voucher',icon:'⚽',color:'bg-blue-100'},
{id:'ps',name:'PlayStation Store',cat:'voucher',icon:'🎮',color:'bg-blue-100'},
{id:'pln',name:'Listrik PLN',cat:'tagihan',icon:'⚡',color:'bg-yellow-100'},
{id:'pulsa',name:'Pulsa & Data',cat:'tagihan',icon:'📱',color:'bg-green-100'},
{id:'pdamm',name:'PDAM',cat:'tagihan',icon:'💧',color:'bg-blue-100'},
{id:'telkom',name:'Telkom',cat:'tagihan',icon:'📞',color:'bg-red-100'},
];
const products={
'ff':[{name:"70 Diamond",price:11500},{name:"140 Diamond",price:20000},{name:"355 Diamond",price:48500},{name:"720 Diamond",price:98000},{name:"1440 Diamond",price:195000},{name:"2000 Diamond",price:270000},{name:"Membership Mingguan",price:28500},{name:"Membership Bulanan",price:85000}],
'mlbb':[{name:"86 Diamond",price:23000},{name:"172 Diamond",price:46000},{name:"257 Diamond",price:69000},{name:"344 Diamond",price:92000},{name:"514 Diamond",price:135000},{name:"706 Diamond",price:185000},{name:"878 Diamond",price:230000},{name:"1048 Diamond",price:275000},{name:"Weekly Pass",price:28500},{name:"Twilight Pass",price:135000}],
'valorant':[{name:"125 VP",price:15000},{name:"420 VP",price:48000},{name:"700 VP",price:80000},{name:"1375 VP",price:150000},{name:"2400 VP",price:250000},{name:"4000 VP",price:410000}],
'genshin':[{name:"300 Genesis",price:60000},{name:"980 Genesis",price:195000},{name:"1980 Genesis",price:390000},{name:"3280 Genesis",price:635000},{name:"Welkin Moon",price:60000}],
'pubg':[{name:"60 UC",price:14500},{name:"325 UC",price:72500},{name:"660 UC",price:145000},{name:"1800 UC",price:360000},{name:"3850 UC",price:725000}],
'pln':[{name:"Token 20.000",price:20000},{name:"Token 50.000",price:50000},{name:"Token 100.000",price:100000},{name:"Token 200.000",price:200000},{name:"Token 500.000",price:500000},{name:"Token 1.000.000",price:1000000}],
'pulsa':[{name:"Telkomsel 5K",price:7000},{name:"Telkomsel 10K",price:12000},{name:"Telkomsel 25K",price:27000},{name:"XL 10K",price:12000},{name:"Indosat 10K",price:12000},{name:"Tri 10K",price:11500},{name:"Paket Data 8GB",price:28500}],
'steam':[{name:"Wallet 45K",price:48000},{name:"Wallet 90K",price:95000},{name:"Wallet 120K",price:125000}],
'roblox':[{name:"80 Robux",price:15000},{name:"400 Robux",price:65000},{name:"800 Robux",price:125000}],
'gplay':[{name:"Play 20K",price:22000},{name:"Play 50K",price:52000},{name:"Play 100K",price:102000}],
'magic':[{name:"100 Diamond",price:25000},{name:"300 Diamond",price:70000}],
'default':[{name:"Paket Starter",price:15000},{name:"Paket Hemat",price:35000},{name:"Paket Sultan",price:100000}]
};
let cart=[];let selectedGame=null;
function getAdmin(id){return (id==='pln'||id==='pulsa')?2500:2000;}
function renderGames(){
document.getElementById('gameGridPopuler').innerHTML=games.filter(g=>g.cat==='populer').map(g=>`<div onclick="openGame('${g.id}')" class="bg-white border rounded-xl p-2 flex flex-col items-center gap-2"><div class="w-full aspect-square ${g.color} rounded-lg flex items-center justify-center text-3xl">${g.icon}</div><span class="text-[10px] font-semibold text-center h-[28px]">${g.name}</span></div>`).join('');
document.getElementById('gameGridTopup').innerHTML=games.filter(g=>g.cat==='topup').map(g=>`<div onclick="openGame('${g.id}')" class="bg-white border rounded-xl p-2 flex flex-col items-center gap-2"><div class="w-full aspect-square ${g.color} rounded-lg flex items-center justify-center text-3xl">${g.icon}</div><span class="text-[10px] font-semibold text-center h-[28px]">${g.name}</span></div>`).join('');
document.getElementById('gameGridVoucher').innerHTML=games.filter(g=>g.cat==='voucher').map(g=>`<div onclick="openGame('${g.id}')" class="bg-white border rounded-xl p-2 flex flex-col items-center gap-2"><div class="w-full aspect-square ${g.color} rounded-lg flex items-center justify-center text-3xl">${g.icon}</div><span class="text-[10px] font-semibold text-center h-[28px]">${g.name}</span></div>`).join('');
document.getElementById('gameGridTagihan').innerHTML=games.filter(g=>g.cat==='tagihan').map(g=>`<div onclick="openGame('${g.id}')" class="bg-white border rounded-xl p-3 flex flex-col items-center gap-2 text-center"><div class="w-10 h-10 ${g.color} rounded-full flex items-center justify-center text-xl">${g.icon}</div><span class="text-[10px] font-bold">${g.name}</span></div>`).join('');
}
function openGame(id){selectedGame=games.find(g=>g.id===id);document.getElementById('section-games').classList.add('hidden');document.getElementById('banner').classList.add('hidden');document.getElementById('section-products').classList.remove('hidden');const pList=products[id]||products['default'];document.getElementById('selectedGameHeader').innerHTML=`<div class="w-12 h-12 ${selectedGame.color} rounded-xl flex items-center justify-center text-2xl">${selectedGame.icon}</div><div><b class="text-sm">${selectedGame.name}</b><p class="text-[11px] text-gray-500">Pilih nominal • + admin ala ShopeePay</p></div>`;document.getElementById('productList').innerHTML=pList.map((p,idx)=>`<div class="bg-white rounded-2xl p-4 border shadow-sm"><b class="text-[12px] block h-[32px]">${p.name}</b><p class="text-blue-600 font-black text-[13px]">Rp ${p.price.toLocaleString('id-ID')}</p><p class="text-[8px] text-gray-400">+ admin Rp ${getAdmin(selectedGame.id).toLocaleString('id-ID')}</p><button onclick="addToCart('${id}',${idx})" class="mt-3 w-full bg-black text-white py-2 rounded-full text-[11px] font-bold">+ Keranjang</button></div>`).join('');}
function showHome(){document.getElementById('section-games').classList.remove('hidden');document.getElementById('banner').classList.remove('hidden');document.getElementById('section-products').classList.add('hidden');}
function setTab(t){document.querySelectorAll('[id^=tab-]').forEach(b=>b.className='bg-gray-100 px-4 py-1.5 rounded-full text-[11px] font-bold');document.getElementById('tab-'+t).className='bg-black text-white px-4 py-1.5 rounded-full text-[11px] font-bold';}
function addToCart(gameId,prodIdx){const prod=(products[gameId]||products['default'])[prodIdx];const game=games.find(g=>g.id===gameId);cart.push({gameId,gameName:game.name,prodName:prod.name,price:prod.price,admin:getAdmin(gameId),icon:game.icon});document.getElementById('cartCount').innerText=cart.length;openCart();renderCart();}
function removeItem(i){cart.splice(i,1);document.getElementById('cartCount').innerText=cart.length;renderCart();if(cart.length===0)closeCart();}
function clearCart(){cart=[];document.getElementById('cartCount').innerText=0;renderCart();closeCart();}
function renderCart(){if(cart.length===0){document.getElementById('cartItems').innerHTML='<p class="text-center text-[11px] text-gray-400 py-4">Keranjang kosong</p>';document.getElementById('cartSummary').innerHTML='';return;}let subtotal=cart.reduce((a,b)=>a+b.price,0);let adminTotal=cart.reduce((a,b)=>a+b.admin,0);let total=subtotal+adminTotal;document.getElementById('cartItems').innerHTML=cart.map((c,i)=>`<div class="flex justify-between items-center bg-gray-50 p-2 rounded-xl text-[11px]"><div class="flex gap-2 items-center"><div class="text-lg">${c.icon}</div><div><b>${c.gameName}</b> - ${c.prodName}<br><span class="text-[9px] text-gray-500">Rp ${c.price.toLocaleString('id-ID')} + admin ${c.admin.toLocaleString('id-ID')}</span></div></div><button onclick="removeItem(${i})" class="bg-red-100 text-red-600 w-7 h-7 rounded-full font-bold">×</button></div>`).join('');document.getElementById('cartSummary').innerHTML=`<div class="flex justify-between"><span>Subtotal (${cart.length} item)</span><span>Rp ${subtotal.toLocaleString('id-ID')}</span></div><div class="flex justify-between"><span>Biaya Admin</span><span>Rp ${adminTotal.toLocaleString('id-ID')}</span></div><div class="flex justify-between font-black text-[13px] border-t pt-2 mt-2"><span>Total Bayar</span><span class="text-blue-600">Rp ${total.toLocaleString('id-ID')}</span></div><button onclick="clearCart()" class="w-full mt-2 bg-white border py-2 rounded-full text-[10px] font-bold">🗑️ Kosongkan Keranjang</button>`;}
function openCart(){document.getElementById('cartModal').classList.remove('hidden')}function closeCart(){document.getElementById('cartModal').classList.add('hidden')}
function processOrder(){if(!document.getElementById('custId').value)return alert('Isi ID dulu bosq');let subtotal=cart.reduce((a,b)=>a+b.price,0);let adminTotal=cart.reduce((a,b)=>a+b.admin,0);let total=subtotal+adminTotal;alert('SUKSES BOSQ! Total Rp '+total.toLocaleString('id-ID'));clearCart();}
renderGames();
</script>
</body>
</html>
